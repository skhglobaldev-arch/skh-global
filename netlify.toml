[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  included_files = ["AI_EMAIL_PROMPT.md", "logo.jpeg"]

[[redirects]]
  from = "/api/audit"
  to = "/.netlify/functions/audit"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200
  force = true

[[redirects]]
  from = "/api/book-slot"
  to = "/.netlify/functions/book-slot"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
