
<!DOCTYPE html>
<html lang="en" class="bg-[#020617] overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SKH.GLOBAL | From Idea to System</title>
    
    <!-- Favicon / Browser Tab Logo -->
    <link rel="icon" type="image/png" href="/skh-logo-mark.png">
    <link rel="apple-touch-icon" href="/skh-logo-mark.png">

    <!-- SEO Meta Tags -->
    <meta name="description" content="SKH.GLOBAL is a premium digital systems studio turning real business problems into web apps, dashboards, booking systems, automation and SaaS products.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef8ff',
                100: '#d9f0ff',
                200: '#b9e6ff',
                300: '#7ddfff',
                400: '#38D8FF',
                500: '#2563EB',
                600: '#7C3AED',
                700: '#6D28D9',
                800: '#4C1D95',
                900: '#1E1B4B',
                950: '#050713',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin-slow 12s linear infinite',
              'grid-flow': 'grid-flow 20s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'grid-flow': {
                '0%': { backgroundPosition: '0 0' },
                '100%': { backgroundPosition: '0 100%' }
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow-x: hidden; background-color: #050713; color: #f8fafc; font-family: 'Inter', sans-serif; }
      #root { min-height: 100%; }
      .perspective-2000 { perspective: 2000px; }
      .preserve-3d { transform-style: preserve-3d; }
      .glass-panel { background: rgba(16, 24, 39, 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(124, 58, 237, 0.18); box-shadow: 0 24px 80px rgba(5, 7, 19, 0.55), 0 0 40px rgba(37, 99, 235, 0.08); }
      .text-3d-hero { transform-style: preserve-3d; transform: perspective(1000px) rotateX(5deg); text-shadow: 0 10px 30px rgba(0, 0, 0, 0.9); }
      .glow-text { text-shadow: 0 0 25px rgba(56, 216, 255, 0.35), 0 0 50px rgba(124, 58, 237, 0.18); }
      .bg-grid { background-image: linear-gradient(to right, rgba(56, 216, 255, 0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(168, 85, 247, 0.035) 1px, transparent 1px); background-size: 64px 64px; }
      .reveal { opacity: 0; transform: translateY(22px) scale(0.985); filter: blur(8px); transition: opacity 0.78s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.78s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.78s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .reveal.active { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      @media (prefers-reduced-motion: reduce) {
        .reveal { opacity: 1; transform: none; filter: none; transition: none; }
        * { scroll-behavior: auto !important; }
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #050713; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
        "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
      }
    }
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <form name="contact-inquiry" data-netlify="true" hidden>
      <input type="text" name="fullName" />
      <input type="text" name="company" />
      <input type="text" name="email" />
      <input type="text" name="investment" />

      <input type="text" name="ticketNumber" />

  </body>
</html>
